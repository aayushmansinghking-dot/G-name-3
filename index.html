<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayushman Runner 3D</title>
<style>
body { margin:0; overflow:hidden; background:#87ceeb; font-family:sans-serif;}
#banner { position:absolute; top:50px; width:100%; text-align:center; font-size:2rem; color:yellow; font-weight:bold; display:none; z-index:10;}
#stats { position:absolute; top:10px; left:10px; color:white; font-size:18px; z-index:10;}
</style>
</head>
<body>
<div id="banner">Welcome to Aayushman World!</div>
<div id="stats">Score: <span id="scoreDisplay">0</span> | Coins: <span id="coinDisplay">0</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
<script>
let scene, camera, renderer;
let player, players=[], trains=[], coins=[];
let lanesY = [-2,0,2];
let currentLane = 1;
let score = 0, coinCount=0, bannerShown=false;
let clock = new THREE.Clock();
let speed = 0.1;

// Initialize Three.js
scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,5,10);
camera.lookAt(0,0,0);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.5));

// Ground
let groundGeo = new THREE.PlaneGeometry(10,200);
let groundMat = new THREE.MeshPhongMaterial({color:0x444444});
let ground = new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.z = -90;
scene.add(ground);

// Player class
class Player3D {
    constructor(name,color,isBoss=false){
        this.name=name;
        this.isBoss=isBoss;
        let geometry = new THREE.BoxGeometry(1,2,1);
        let material = new THREE.MeshStandardMaterial({color:color});
        if(isBoss){ material.emissive = new THREE.Color(0x00ffff); material.emissiveIntensity = 0.5;}
        this.mesh = new THREE.Mesh(geometry,material);
        this.mesh.position.set(0,1,0);
        scene.add(this.mesh);
    }
    moveLane(lane){
        this.mesh.position.x = lanesY[lane];
    }
    jump(){
        let initialY = this.mesh.position.y;
        let jumpUp = {y: initialY+2};
        let jumpDown = {y: initialY};
        let t=0;
        let interval = setInterval(()=>{
            t+=0.1;
            if(t<1) this.mesh.position.y = initialY+2*t;
            else if(t<2) this.mesh.position.y = initialY+2*(2-t);
            else { this.mesh.position.y = initialY; clearInterval(interval);}
        },16);
    }
}

// Initialize players
players.push(new Player3D("ANSH",0x0000ff)); // free
players.push(new Player3D("EKLAVYA",0x00ff00));
players.push(new Player3D("PIYUSH",0xffa500));
players.push(new Player3D("PRINCE",0x800080));
players.push(new Player3D("HIMANSHU",0xff1493));
players.push(new Player3D("AAYUSHMAN",0x00ffff,true)); // boss glowing

player = players[0];

// Train obstacle
class Train{
    constructor(z){
        let geo = new THREE.BoxGeometry(1,1,4);
        let mat = new THREE.MeshStandardMaterial({color:0xff0000});
        this.mesh = new THREE.Mesh(geo,mat);
        let lane = lanesY[Math.floor(Math.random()*lanesY.length)];
        this.mesh.position.set(lane,0.5,z);
        scene.add(this.mesh);
    }
    move(){
        this.mesh.position.z += speed*50;
    }
}

// Coin object
class Coin{
    constructor(z){
        let geo = new THREE.SphereGeometry(0.3,16,16);
        let mat = new THREE.MeshStandardMaterial({color:0xffff00});
        this.mesh = new THREE.Mesh(geo,mat);
        let lane = lanesY[Math.floor(Math.random()*lanesY.length)];
        this.mesh.position.set(lane,0.5,z);
        scene.add(this.mesh);
    }
    move(){
        this.mesh.position.z += speed*50;
    }
}

// Controls
document.addEventListener('keydown',(e)=>{
    if(e.key==='ArrowLeft' && currentLane>0) currentLane--;
    if(e.key==='ArrowRight' && currentLane<2) currentLane++;
    player.moveLane(currentLane);
    if(e.key==='ArrowUp') player.jump();
});

// Spawn trains and coins
function spawnObjects(){
    if(Math.random()<0.02) trains.push(new Train(-100));
    if(Math.random()<0.02) coins.push(new Coin(-100));
}

// Collision detection
function checkCollision(a,b){
    let dx = Math.abs(a.mesh.position.x - b.mesh.position.x);
    let dz = Math.abs(a.mesh.position.z - b.mesh.position.z);
    return dx<0.75 && dz<1.5;
}

// Animate
function animate(){
    requestAnimationFrame(animate);
    speed += 0.0001;

    // Move trains
    trains.forEach((t,i)=>{
        t.move();
        if(checkCollision(player,t)){
            alert("Game Over! Score: "+score+" Coins: "+coinCount);
            location.reload();
        }
        if(t.mesh.position.z>10){
            scene.remove(t.mesh);
            trains.splice(i,1);
            score++;
            document.getElementById('scoreDisplay').innerText=score;
            if(score>=10 && !bannerShown){
                document.getElementById('banner').style.display='block';
                bannerShown=true;
            }
        }
    });

    // Move coins
    coins.forEach((c,i)=>{
        c.move();
        if(checkCollision(player,c)){
            coinCount++;
            document.getElementById('coinDisplay').innerText=coinCount;
            scene.remove(c.mesh);
            coins.splice(i,1);
        }
        if(c.mesh.position.z>10){ scene.remove(c.mesh); coins.splice(i,1);}
    });

    spawnObjects();

    // Camera follow
    camera.position.z = player.mesh.position.z + 10;
    camera.position.x = player.mesh.position.x;
    camera.lookAt(player.mesh.position);

    renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
